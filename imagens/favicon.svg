<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#6f42c1" rx="12"/>
  
  <!-- Reciclagem + Planeta (Sustentabilidade) -->
  <g transform="translate(50, 50)">
    <!-- Símbolo de reciclagem estilizado -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    
    <!-- Seta superior direita -->
    <path d="M 20,-5 Q 25,-15 15,-18" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Seta inferior direita -->
    <path d="M 15,18 Q 10,25 -5,22" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Seta esquerda -->
    <path d="M -22,5 Q -28,-5 -18,-15" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Planeta verde no centro (símbolo de sustentabilidade) -->
    <circle cx="0" cy="0" r="6" fill="#4ade80"/>
    <circle cx="2" cy="-1" r="1.5" fill="#10b981" opacity="0.7"/>
  </g>
</svg>